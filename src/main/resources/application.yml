server:
  port: 8090

spring:
  application:
    name: replay-backend
  # Redis Streams 传输总线（盘中实时 L2，同花顺 L2 契约 v1.0）：爬虫 XADD 生产，后端 XREADGROUP 消费。
  # 生产指向 Windows 侧的 Redis（与 CK/OG 同机 100.97.74.45）；开发期可改 localhost 起 redis-server。
  data:
    redis:
      host: ${REPLAY_REDIS_HOST:100.97.74.45}
      port: ${REPLAY_REDIS_PORT:6379}
      timeout: 5000
  datasource:
    # ----------------------------------------------------------------------
    # 双数据源架构（与爬虫工程 crawler-backend-new 保持一致）：
    #   og（openGauss, @Primary） —— 只支撑「分布式任务行记录」，不参与分析数据读写。
    #   ch（ClickHouse）          —— 业务数据 / 股票分析数据「全部」走 CK（读原始层 + 写计算层）。
    # ----------------------------------------------------------------------
    og:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://100.92.86.64:15432/postgres
      username: dbuser
      password: OpenGauss@2026
      maximum-pool-size: 8
      connection-timeout: 30000
      # 启动不强制连 OG：openGauss 短暂不可用时，CK-only 的计算层仍可独立运行。
      # 生产若要求 OG 必须可用，删掉此行（恢复默认 fail-fast）即可。
      hikari:
        initialization-fail-timeout: 0
    ch:
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      # 分析型库 crawler（真实库：Windows CK 100.97.74.45，全部表为 ReplacingMergeTree，支持 FINAL）。
      # ⚠️ 旧 Linux CK 124.223.220.245 是过期副本（表为普通 MergeTree、dragon_tiger 缺列），千万别用，会报 ILLEGAL_FINAL。
      jdbc-url: jdbc:clickhouse://100.97.74.45:8123/crawler?compress=0&use_server_time_zone=false&rewrite_batch_inserts=true
      username: default
      password: pamirs@123
      maximum-pool-size: 16
      connection-timeout: 30000
      # ClickHouse 不支持事务，强制 auto-commit，避免事务管理器误触发 setAutoCommit(false)
      auto-commit: true
      # Windows CK 偶发 Broken pipe / Connection reset 会污染连接池：借出时用 SELECT 1 校验，
      # 自动剔除死连接；keepalive 主动保活，避免长空闲后被服务端断开。
      # 注意：实测 Windows 端（NAT/防火墙）会静默断开长空闲连接，Hikari 无法感知 → 复用即报
      # "Connection is closed"（裸 HTTP 每请求新建连接则 100% 可用）。故 max-lifetime 缩短到
      # 5 分钟强制周期性重建连接，让池中连接保持新鲜。
      hikari:
        connection-test-query: SELECT 1
        validation-timeout: 5000
        keepalive-time: 30000
        max-lifetime: 300000
        idle-timeout: 60000

# MyBatis 的 map-underscore-to-camel-case 在 DataSourceConfig 中按 SqlSessionFactory 显式设置，
# 这里不再由自动配置接管（已排除 MybatisAutoConfiguration）。

# ---------------- 复盘计算参数（阈值集中管理，便于按市场风格调参）----------------
replay:
  # 情绪温度（S2）：历史样本不足时用绝对阈值降级，够了自动切分位数
  sentiment:
    min-history-days: 60
    ice-limit-up-max: 30      # <=30 家 → 冰点
    cold-limit-up-max: 60     # <=60 家 → 偏冷
    warm-limit-up-max: 100    # <=100 家 → 温和
    hot-limit-up-max: 150     # <=150 家 → 活跃；再高 → 高潮
    strong-money-effect: 3.0  # >=3% 赚钱效应强
    weak-money-effect: -1.0   # <=-1% 亏钱效应

  # 主线识别（S4）
  mainline:
    board-type: 3             # 只在概念板块(board_type=3)里找主线；行业板块(2)用于交叉验证
    min-limit-up: 2           # 板块至少要有几只涨停才有资格进主线候选
    top-n: 20                 # 输出前 N 个主线
    weight-limit-up: 0.5      # 涨停家数（归一化后）权重
    weight-pct-chg: 0.3       # 板块涨幅权重
    weight-fund: 0.2          # 主力净流入权重

  # 龙头定位（S5）
  leader:
    top-n-per-board: 5

  # 炒作因子（S7）：六因子权重，综合分 = Σ(wᵢ·因子ᵢ)/Σwᵢ × 100；缺省等权
  theme:
    w-scarcity: 0.2     # 稀缺性：成分股越少越稀缺，越易抱团
    w-imagination: 0.2  # 想象空间：题材天花板高低
    w-sudden: 0.2       # 突发性：当日涨停集体启动强度
    w-certainty: 0.2    # 确定性：题材逻辑当日被市场验证
    w-min-resist: 0.2   # 最小阻力方向（势）：涨+资金流入+达主线阈值+突发 共振        # 每个主线板块输出前 N 只

  # 启动触发
  calc:
    on-startup: true          # 应用启动后对最新交易日跑一轮（端到端验证用）；改为 false 可关闭

  # 分布式任务（OG 行记录）：任务心跳 / 超时判定
  task:
    heartbeat-seconds: 60     # 超过该时间未更新 → 任务被认为失联，可被其它节点重新认领
    max-attempt: 3            # 单日单类型最大重试次数

  # ---------------- 盘中实时模拟盘（M1）----------------
  stream:
    group: replay-consumer    # Redis Streams 消费组名
    consumer: node-1          # 消费者名
    block-ms: 500             # XREADGROUP 阻塞时长
    batch: 100                # 每次最多取多少条
    feature-interval-ms: 3000 # 特征计算周期（决策输入节拍）
    tick-window-seconds: 900  # 内存滚动窗口保留时长（15 分钟），用于算大单净主动买入
    pool-refresh-ms: 30000    # 兜底刷新 ths:l2:pool 股票池的周期（防 pub/sub 丢消息导致不一致）
    quote-refresh-ms: 1000    # 周期拉取 ths:l2:quote:{code}（Hash，非 Stream，只能轮询）快照的周期；tick 价格回贴依赖它
    xtrim-max-len: 10000      # 收盘 XTRIM 单股逐笔流保留条数（对齐同花顺契约 v1.0）
    # ---------------- M3 拆单识别阈值 ----------------
    stealth-window-sec: 30        # 拆单识别窗口（秒）：统计同向小单累计量
    stealth-min-volume: 10000     # 拆单"破当量"阈值（手）：同向小单累计达万手→拆单吸筹
    sweep-window-sec: 10          # 扫单窗口（秒）：统计主买密度与量强度
    self-trade-window-ms: 200     # 对敲配对时间容差（ms）
    self-trade-vol-tol: 0.2       # 对敲量相近容差（比例）
    big-order-threshold: 500000   # 大单阈值（元）：单笔成交额 >= 该值视为大单（约 50 万）
    # 衍生特征阈值
    net-buy-strong: 2000000   # 近窗口大单净主动买入额 >= 该值 → 资金确认强（元）
    vol-breakout-ratio: 3.0   # 当日成交额 / 过去 N 日均值 >= 该倍 → 放量突破
    # L2 数据开关（默认关闭）：关闭后交易引擎不再要求资金层 CONFIRM，按纯技术面买卖点决策；
    # 决策仍正常落库，capital_signal 标记为 L2_OFF，context_json 中 l2_used=false。
    l2:
      enabled: false
    # L1 降级消费开关（默认开启）：L2 不可用时，读 l1:ticks + l1:quotes 全局流，
    # 按 ths:l2:pool 过滤后写入 TickWindow，复用特征计算 + 交易引擎全链路。
    # L1 tick 含 price+vol 但无方向字段，方向由 price vs 盘口 bid1/ask1 推断。
    l1:
      enabled: true
  # 次日可溯源观察池（watch_pool）：从 S4/S5/S7 捞股同步 Redis pool
  watch-pool:
    s7-min-total: 60          # S7 题材入选阈值（total 分 0~100），低于此分的题材不展开成个股
  sim:
    # M1 单票小闭环演示：默认关注标的（用户盘中真实回传的标的之一）
    demo-ts-code: 600519      # 贵州茅台（示例；实际以 plan_pool 为准）
    demo-stock-name: 贵州茅台
    account-id: sim-001       # 模拟账户标识
    init-cash: 1000000        # 模拟账户初始资金（元）
    default-position-pct: 0.1 # 单笔默认仓位（计划未指定 planned_position_pct 时使用）
    auto-execute: true        # 决策 BUY/SELL 是否自动执行模拟成交（false=只出建议）
